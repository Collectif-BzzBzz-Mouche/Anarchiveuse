<!-------------------------------------------------------------
                      TRAINEE SOURIS        
-------------------------------------------------------------->
  <script>
  const MAX_TRACES = 4;
  const SPACING = 40;
  const IMAGES = [
    'images/trainee1.png',
    'images/trainee2.png',
    'images/trainee3.png',
  ];
  let imageIndex = 0;
  const traces = [];
  let lastX = -9999, lastY = -9999;

  function createTrace(x, y) {
    // Décalage aléatoire autour du point
    const offsetX = (Math.random() - 0.5) * 40; // ±10px
    const offsetY = (Math.random() - 0.5) * 40; // ±10px
    const rotation = Math.floor(Math.random() * 360);

    // Alterner les images dans l'ordre
    const src = IMAGES[imageIndex % IMAGES.length];
    imageIndex++;

    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = `
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      width: 32px;
      height: auto;
      transform: translate(-50%, -50%) rotate(${rotation}deg);
      transition: opacity 0.3s ease;
    `;
    img.style.left = (x + offsetX) + 'px';
    img.style.top = (y + offsetY) + 'px';
    img.style.opacity = '1';
    document.body.appendChild(img);
    traces.push({ el: img });

    if (traces.length > MAX_TRACES) {
      const old = traces.shift();
      old.el.remove();
    }

    traces.forEach((t, i) => {
      t.el.style.opacity = (i + 1) / traces.length;
    });
  }

  document.addEventListener('mousemove', (e) => {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist >= SPACING) {
      createTrace(e.clientX, e.clientY);
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });
</script>

<!-------------------------------------------------------------
                      BACKGROUND VIDEO
-------------------------------------------------------------->
 <div class="hero">
    <video class="hero-video" loop playsinline preload="auto">
      <source src="videos/Anarchiveuse.mp4" type="video/mp4">
    </video>
    <div class="hero-mark">
      <img class="hero-image" src="images/Anarchiveuse_2.gif" alt="L'Anarchiveuse">
      <button type="button" class="scroll-arrow" aria-label="Lancer la vidéo">↓</button>
    </div>
  </div>

  <script>
    const heroVideo = document.querySelector('.hero-video');
    const SCROLL_THRESHOLD = 40;
    let wheelDown = 0;
    let touchStartY = null;
    let scrolledDown = false;
    let armReveal = false;

    heroVideo.addEventListener('playing', () => {
      if (!armReveal) return;
      heroVideo.classList.add('is-playing');
      stopScrollListeners();
    });

    const scrollArrow = document.querySelector('.scroll-arrow');

    function setArrowVisible(visible) {
      scrollArrow.classList.toggle('is-hidden', !visible);
    }

    function launchHeroVideo() {
      if (armReveal || heroVideo.classList.contains('is-playing')) return;
      armReveal = true;
      setArrowVisible(false);
      const pending = heroVideo.play();
      if (!pending) return;
      pending.catch(() => {
        heroVideo.muted = true;
        const retry = heroVideo.play();
        if (retry) {
          retry.catch(() => { armReveal = false; setArrowVisible(true); });
        } else {
          armReveal = false;
          setArrowVisible(true);
        }
      });
    }

    function wheelPixels(e) {
      if (e.deltaMode === 1) return e.deltaY * 16;
      if (e.deltaMode === 2) return e.deltaY * window.innerHeight;
      return e.deltaY;
    }

    function onWheel(e) {
      const dy = wheelPixels(e);
      if (dy <= 0) {
        wheelDown = 0;
        return;
      }
      wheelDown += dy;
      if (wheelDown >= SCROLL_THRESHOLD) launchHeroVideo();
    }

    function onTouchStart(e) {
      if (e.touches.length !== 1) return;
      touchStartY = e.touches[0].clientY;
      scrolledDown = false;
    }

    function onTouchMove(e) {
      if (touchStartY == null) return;
      const dy = touchStartY - e.touches[0].clientY;
      if (dy >= SCROLL_THRESHOLD) scrolledDown = true;
    }

    function onTouchEnd() {
      if (scrolledDown) launchHeroVideo();
      touchStartY = null;
      scrolledDown = false;
    }

    function stopScrollListeners() {
      document.removeEventListener('wheel', onWheel, true);
      document.removeEventListener('touchstart', onTouchStart, true);
      document.removeEventListener('touchmove', onTouchMove, true);
      document.removeEventListener('touchend', onTouchEnd, true);
      scrollArrow.removeEventListener('click', launchHeroVideo);
    }

    scrollArrow.addEventListener('click', launchHeroVideo);

    document.addEventListener('wheel', onWheel, { capture: true, passive: true });
    document.addEventListener('touchstart', onTouchStart, { capture: true, passive: true });
    document.addEventListener('touchmove', onTouchMove, { capture: true, passive: true });
    document.addEventListener('touchend', onTouchEnd, { capture: true, passive: true });
  </script>
