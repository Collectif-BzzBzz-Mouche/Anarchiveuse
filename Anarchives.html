                      TRAINEE SOURIS        
-------------------------------------------------------------->
  <script>
  const MAX_TRACES = 4;
  const SPACING = 40;
  const IMAGES = [
    'images/trainee1.png',
    'images/trainee2.png',
    'images/trainee3.png',
  ];
  let imageIndex = 0;
  const traces = [];
  let lastX = -9999, lastY = -9999;

  function createTrace(x, y) {
    // Décalage aléatoire autour du point
    const offsetX = (Math.random() - 0.5) * 40; // ±10px
    const offsetY = (Math.random() - 0.5) * 40; // ±10px
    const rotation = Math.floor(Math.random() * 360);

    // Alterner les images dans l'ordre
    const src = IMAGES[imageIndex % IMAGES.length];
    imageIndex++;

    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = `
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      width: 32px;
      height: auto;
      transform: translate(-50%, -50%) rotate(${rotation}deg);
      transition: opacity 0.3s ease;
    `;
    img.style.left = (x + offsetX) + 'px';
    img.style.top = (y + offsetY) + 'px';
    img.style.opacity = '1';
    document.body.appendChild(img);
    traces.push({ el: img });

    if (traces.length > MAX_TRACES) {
      const old = traces.shift();
      old.el.remove();
    }

    traces.forEach((t, i) => {
      t.el.style.opacity = (i + 1) / traces.length;
    });
  }

  document.addEventListener('mousemove', (e) => {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist >= SPACING) {
      createTrace(e.clientX, e.clientY);
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });
</script>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="fisheye" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse"
          x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feFlood flood-color="rgb(128,128,128)" result="neutral"/>
    <feImage id="fisheye-lens" href="" x="-9999" y="-9999" width="640" height="640" result="lens"/>
    <feComposite in="lens" in2="neutral" operator="over" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="40"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
(function () {
  const LENS = 640;
  const MAX_SHIFT = 100;
  const grille = document.querySelector('.grille');
  const lens = document.getElementById('fisheye-lens');
  if (!grille || !lens) return;

  const canvas = document.createElement('canvas');
  canvas.width = LENS;
  canvas.height = LENS;
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(LENS, LENS);
  const data = image.data;
  const radius = LENS / 2;
  const strength = MAX_SHIFT / (radius * 0.385);

  for (let y = 0; y < LENS; y++) {
    for (let x = 0; x < LENS; x++) {
      const dx = x - radius;
      const dy = y - radius;
      const dist = Math.sqrt(dx * dx + dy * dy) / radius;
      let ox = 0;
      let oy = 0;
      if (dist < 1) {
        const falloff = 1 - dist * dist;
        ox = -dx * strength * falloff;
        oy = -dy * strength * falloff;
      }
      const i = (y * LENS + x) * 4;
      data[i]     = Math.max(0, Math.min(255, 128 + (ox / MAX_SHIFT) * 127));
      data[i + 1] = Math.max(0, Math.min(255, 128 + (oy / MAX_SHIFT) * 127));
      data[i + 2] = 128;
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);
  lens.setAttribute('href', canvas.toDataURL());

  function place(clientX, clientY) {
    const rect = grille.getBoundingClientRect();
    const inside = clientX >= rect.left && clientX <= rect.right &&
                   clientY >= rect.top && clientY <= rect.bottom;
    const x = inside ? clientX - rect.left - radius : -9999;
    const y = inside ? clientY - rect.top - radius : -9999;
    lens.setAttribute('x', x);
    lens.setAttribute('y', y);
  }

  document.addEventListener('mousemove', (e) => place(e.clientX, e.clientY));
  document.addEventListener('mouseleave', () => {
    lens.setAttribute('x', -9999);
    lens.setAttribute('y', -9999);
  });
})();
</script>
